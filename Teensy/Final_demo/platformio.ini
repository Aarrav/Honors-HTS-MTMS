; ============================================================
;  PlatformIO project configuration
;  Board  : Teensy 4.0
;  Target : MAVLink RC + Morph Servos + 4x DC Motor drive
; ============================================================

[env:teensy40]
platform  = teensy
board     = teensy40
framework = arduino

; ---- Serial monitor ----
monitor_speed = 115200

; ---- MAVLink library from GitHub ----
; This pulls in the c_library_v2 (common dialect) automatically.
lib_deps =
    https://github.com/mavlink/c_library_v2.git

; ---- Compiler flags ----
; Tell MAVLink which serial channel to use on this MCU
build_flags =
    -DMAVLINK_COMM_NUM_BUFFERS=1
